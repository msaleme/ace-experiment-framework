[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-experiment-framework"
version = "0.1.2"
description = "Automated Compute Efficiency Experimental Lab - Config-driven experimental framework for discovering compute optimizations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Michael K. Saleme"}
]
keywords = ["benchmarking", "reproducibility", "experiment-tracking", "machine-learning", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.scripts]
ace = "ace_lab.cli:main"

[project.urls]
Homepage = "https://github.com/msaleme/ace-experiment-framework"
Repository = "https://github.com/msaleme/ace-experiment-framework"
Issues = "https://github.com/msaleme/ace-experiment-framework/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ace_lab*"]

[tool.setuptools.package-data]
ace_lab = ["resources/benchmarks/*.yaml"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
